name: Build Asuswrt-Modx Next RT-AX54

on:
  workflow_dispatch:
    inputs:
      board:
        description: Board profile
        required: true
        default: 360-T6GS
        type: choice
        options:
          - H3C-TX180X
          - JCG-Q20
          - CMCC-A9
          - CMCC-A9.2
          - RX6000
          - KOMI-A8
          - 360-T6GS
      ref:
        description: Upstream branch/tag/commit to build
        required: false
        default: "69196"
        type: string

permissions:
  contents: read

concurrency:
  group: rtax54-firmware-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.board }}
    runs-on: ubuntu-22.04
    timeout-minutes: 720
    env:
      SELECTED_BOARD: ${{ inputs.board }}
      BUILD_ROOT: /build
      SOURCE_REPO: https://github.com/vb1980/asuswrt-modx-next.git
      SOURCE_REF: ${{ inputs.ref || '69196' }}

    steps:
      - name: Check out build scripts
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint autogen antlr3 binutils binutils-dev \
            bison build-essential bzip2 cmake device-tree-compiler dos2unix flex gawk \
            gengetopt gettext git gperf intltool lib32gcc-s1 lib32stdc++6 lib32z1 \
            libc6-dev-i386 libelf-dev libelf1:i386 libglib2.0-dev libltdl-dev \
            liblzma-dev liblzo2-dev libncurses5:i386 libncurses5-dev libssl-dev \
            libtool libtool-bin msmtp p7zip-full patch qemu-utils sharutils shtool \
            subversion texinfo uglifyjs unzip upx-ucl uuid-dev wget xmlto xsltproc \
            zlib1g-dev

      - name: Install MIPS toolchain
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/SWRT-dev/mtk-toolchains.git "$RUNNER_TEMP/mtk-toolchains"
          toolchain="$RUNNER_TEMP/mtk-toolchains/toolchain-mipsel_24kc_gcc-5.4.0_musl-1.1.24"
          test -d "$toolchain"
          test -x "$toolchain/bin/mipsel-openwrt-linux-musl-gcc"
          test -x "$toolchain/bin/mipsel-openwrt-linux-gcc"
          sudo mkdir -p /opt/lede-toolchain-ramips-mt7621_gcc-5.4.0_musl-1.1.24.Linux-x86_64
          sudo ln -sfn "$toolchain" \
            /opt/lede-toolchain-ramips-mt7621_gcc-5.4.0_musl-1.1.24.Linux-x86_64/toolchain-mipsel_24kc_gcc-5.4.0_musl-1.1.24
          sudo ln -sfn "$toolchain" /opt/toolchain-mipsel_24kc_gcc-5.4.0_musl-1.1.24
          /opt/lede-toolchain-ramips-mt7621_gcc-5.4.0_musl-1.1.24.Linux-x86_64/toolchain-mipsel_24kc_gcc-5.4.0_musl-1.1.24/bin/mipsel-openwrt-linux-musl-gcc --version
          df -h /

      - name: Clone upstream source into short build path
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p "$BUILD_ROOT"
          sudo chown "$(id -u):$(id -g)" "$BUILD_ROOT"
          git clone --depth 1 --branch "$SOURCE_REF" "$SOURCE_REPO" "$BUILD_ROOT"
          cd "$BUILD_ROOT"
          test -d release/src-ra-openwrt-4210
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SOURCE_COMMIT="$(git rev-parse --short HEAD)"
          printf 'Build path: %s\nUpstream source: %s @ %s (%s)\n' "$PWD" "$SOURCE_REPO" "$SOURCE_REF" "$SOURCE_COMMIT"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          df -h /

      - name: Build selected profile
        working-directory: ${{ env.BUILD_ROOT }}/release/src-ra-openwrt-4210
        shell: bash
        run: make BOARD_PROFILE="$SELECTED_BOARD" rt-ax54

      - name: Collect firmware
        shell: bash
        working-directory: ${{ env.BUILD_ROOT }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find release/src-ra-openwrt-4210/image -maxdepth 1 -type f \
            \( -name "*.trx" -o -name "*.md5" \) \
            -exec cp -a {} artifacts/ \;
          test -n "$(find artifacts -maxdepth 1 -type f -name "*.trx" -print -quit)"

      - name: Rename firmware with board name
        shell: bash
        working-directory: ${{ env.BUILD_ROOT }}
        run: |
          set -euo pipefail
          cd artifacts
          shopt -s nullglob
          for trx in *.trx; do
            base="${trx%.trx}"
            new="${base}_${SELECTED_BOARD}.trx"
            mv -- "$trx" "$new"
            md5sum "$new" > "${new%.trx}.md5"
            rm -f "${base}.md5"
            printf 'Renamed: %s -> %s\n' "$trx" "$new"
          done
          ls -l

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-rt-ax54-${{ env.SELECTED_BOARD }}-${{ env.SOURCE_COMMIT }}-${{ github.run_number }}
          path: /build/artifacts/
          if-no-files-found: error
          retention-days: 14
